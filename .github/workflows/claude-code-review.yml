name: Claude Code Review

# PR이 처음 생성될 때 한 번만 Claude가 자동으로 코드 리뷰를 남깁니다.
# 이후 커밋 push에 대한 재리뷰는 claude.yml의 @claude 멘션 트리거를 사용합니다.
on:
  pull_request:
    types: [opened]
    branches: [develop, main]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest

    permissions:
      contents: read          # 코드 체크아웃
      pull-requests: write     # 리뷰 코멘트 작성
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Claude Pro/Max 구독 토큰. 로컬 Claude Code에서 /install-github-app 으로 발급 후
          # 레포 Settings > Secrets and variables > Actions 에 CLAUDE_CODE_OAUTH_TOKEN 로 등록
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이 PR(#${{ github.event.pull_request.number }}, 저장소: ${{ github.repository }})의
            변경 사항을 코드 리뷰해 주세요. 모든 응답은 한국어로 작성합니다.

            PR 번호와 저장소는 이미 위에 주어졌습니다. `gh pr list`, `env`, `printenv`, `gh auth status`,
            `which gh` 등으로 PR 번호나 컨텍스트를 직접 알아내려 하지 말고, 항상
            `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }}`처럼
            PR 번호와 `--repo`를 명시해서 gh 명령을 호출하세요 (checkout이 detached HEAD 상태라
            인자 없이 호출하면 PR을 자동으로 인식하지 못할 수 있습니다).

            [리뷰 관점]
            - 버그 및 잠재적 런타임 오류
            - Swift / SwiftUI 관용 표현 및 모범 사례
            - Tuist 모듈 레이어 의존성 방향 위반 (상위→하위 단방향 유지)
            - 네이밍, 가독성, 중복 제거
            - 테스트 커버리지가 필요한 부분

            [중요도 표기] 모든 지적에는 아래 중요도를 앞에 붙입니다.
            - **MUST**: 반드시 수정이 필요한 내용 (버그, 크래시, 의존성 위반 등)
            - **MAY**: 수정을 권장하는 내용 (개선 제안, 스타일, 리팩터링 등)

            [남기는 방식] 반드시 두 가지를 모두 수행하세요.
            1) 개별 지적은 해당 코드가 있는 diff 라인에 인라인 코멘트로 남깁니다.
               (create_inline_comment 도구 사용. 각 코멘트는 `[중요도] 내용` 형식으로 작성.
                예: `[MUST] 옵셔널 강제 언래핑으로 nil일 때 크래시가 발생합니다.`,
                    `[MAY] 이 로직은 computed property로 분리하면 가독성이 좋아집니다.`)
            2) 리뷰가 끝나면 전체 요약을 PR에 하나의 코멘트로 남깁니다.
               (`gh pr comment` 사용) 요약에는 다음을 포함하세요.
               - 변경 사항 한 줄 개요
               - MUST 항목 목록 (없으면 "없음")
               - MAY 항목 목록 (없으면 "없음")
               - 종합 의견 (머지 가능 여부 소견)

            사소한 취향 차이는 지적하지 말고, 실제로 개선이 필요한 부분만 간결하게 남기세요.
            MUST 항목이 하나도 없으면 요약에 그 점을 명확히 밝혀 주세요.
          # 파일 읽기 + 인라인 코멘트 + PR 요약 코멘트 도구만 허용 (코드 변경은 하지 않음)
          # TodoWrite: 작업 계획 수립에 기본적으로 쓰이는 도구라 허용 목록에서 빠지면
          # 권한 거부가 반복되며 리뷰가 조기 종료될 수 있어 포함
          claude_args: |
            --allowed-tools "Read,Grep,Glob,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          # 실패 재현 시 어떤 툴 호출이 거부됐는지 로그에서 바로 확인하기 위해 활성화
          show_full_output: true
