name: Lint & Format

# PR이 생성/업데이트될 때 코드 스타일을 검사합니다.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

concurrency:
  group: lint-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: SwiftLint & SwiftFormat
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mise.toml에 고정된 swiftlint / swiftformat 버전을 설치합니다.
      - name: Setup mise (SwiftLint, SwiftFormat)
        uses: jdx/mise-action@v2

      # 포맷 위반 시 실패 (수정하지 않고 검사만). 로컬에선 --lint 없이 실행하면 자동 수정됩니다.
      - name: SwiftFormat (lint mode)
        run: swiftformat --lint .

      # 경고를 에러로 승격시켜, 위반이 있으면 CI가 실패합니다.
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      # Secrets/*.xcconfig(실값)가 git add -f 등으로 실수로 커밋되는 것을 막습니다.
      - name: Guard against committed Secrets xcconfig
        run: |
          LEAKED=$(git ls-files 'Projects/App/Config/Secrets/*.xcconfig')
          if [ -n "$LEAKED" ]; then
            echo "::error::다음 파일이 gitignore 대상인데 커밋되어 있습니다:"
            echo "$LEAKED"
            exit 1
          fi

      # 위 스텝 중 하나라도 실패하면 Discord로 알림을 보냅니다.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "❌ [$WORKFLOW_NAME] 실패" \
              --arg desc "PR #$PR_NUMBER: $PR_TITLE" \
              --arg actor "$ACTOR" \
              --arg run_url "$RUN_URL" \
              --arg pr_url "$PR_URL" \
              '{embeds: [{title: $title, description: $desc, url: $run_url, color: 15158332, fields: [{name: "실행자", value: $actor, inline: true}, {name: "PR", value: $pr_url, inline: true}]}]}')"
