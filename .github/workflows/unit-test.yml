name: UnitTest

# PR이 생성/업데이트될 때 자동으로 유닛 테스트를 실행합니다.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

# 같은 PR에 새 커밋이 푸시되면 이전 실행은 취소합니다.
concurrency:
  group: unit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Run Unit Tests
    runs-on: macos-15

    env:
      # Momogo 스킴은 앱 실행용 커스텀 스킴이라 테스트 액션이 비어 있으므로,
      # Tuist가 자동 생성한 워크스페이스 스킴(전체 모듈 테스트 포함)을 사용합니다.
      SCHEME: Momogo-Workspace
      # 필요에 맞게 시뮬레이터 기종/OS를 조정하세요.
      DESTINATION: 'platform=iOS Simulator,name=iPhone 16,OS=latest'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Base URL secrets xcconfig
        env:
          API_BASE_URL_DEV: ${{ secrets.API_BASE_URL_DEV }}
          API_BASE_URL_PROD: ${{ secrets.API_BASE_URL_PROD }}
        run: |
          mkdir -p Projects/App/Config/Secrets
          printf '%s\n' "API_BASE_URL = https:/\$()/${API_BASE_URL_DEV}/" > Projects/App/Config/Secrets/Debug.xcconfig
          printf '%s\n' "API_BASE_URL = https:/\$()/${API_BASE_URL_PROD}/" > Projects/App/Config/Secrets/Release.xcconfig

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # mise.toml에 고정된 버전으로 Tuist를 설치합니다.
      - name: Setup mise (Tuist)
        uses: jdx/mise-action@v2

      - name: Install xcbeautify
        run: brew install xcbeautify

      # Xcode 프로젝트는 gitignore 대상이므로 CI에서 직접 생성합니다.
      - name: Tuist install & generate
        run: |
          tuist install
          tuist generate --no-open

      - name: Show environment
        run: |
          xcodebuild -version
          tuist version
          xcrun simctl list devices available | grep -i iphone || true

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Momogo.xcworkspace \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

      # 위 스텝 중 하나라도 실패하면 Discord로 알림을 보냅니다.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "❌ [$WORKFLOW_NAME] 실패" \
              --arg desc "PR #$PR_NUMBER: $PR_TITLE" \
              --arg actor "$ACTOR" \
              --arg run_url "$RUN_URL" \
              --arg pr_url "$PR_URL" \
              '{embeds: [{title: $title, description: $desc, url: $run_url, color: 15158332, fields: [{name: "실행자", value: $actor, inline: true}, {name: "PR", value: $pr_url, inline: true}]}]}')"

      # 유닛 테스트가 성공하면 Discord로 알림을 보냅니다.
      - name: Notify Discord on success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "✅ [$WORKFLOW_NAME] 성공" \
              --arg desc "PR #$PR_NUMBER: $PR_TITLE" \
              --arg actor "$ACTOR" \
              --arg run_url "$RUN_URL" \
              --arg pr_url "$PR_URL" \
              '{embeds: [{title: $title, description: $desc, url: $run_url, color: 3066993, fields: [{name: "실행자", value: $actor, inline: true}, {name: "PR", value: $pr_url, inline: true}]}]}')"
